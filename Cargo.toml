[package]
name = "deskchalk"
version = "0.3.0"
edition = "2021"
description = "Draw labeled boxes on your desktop wallpaper, behind your icons."
repository = "https://github.com/WuzNab/DeskChalk"
license-file = "LICENSE.txt"
publish = false
build = "build.rs"

[[bin]]
name = "DeskChalk"
path = "src/main.rs"

[dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

# Linux: fullscreen edit windows (X11 and Wayland, libraries loaded at run time), the tray
# icon (StatusNotifierItem over D-Bus), and reading/writing wallpaper images.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "rwh_06"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
memmap2 = "0.9"
png = "0.17"
zune-jpeg = "0.4"
image-webp = "0.2"
x11rb = "0.13"

[build-dependencies]
tiny-skia = "0.11"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tiny-skia = { version = "0.11", features = ["png-format"] }
